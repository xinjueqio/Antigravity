name: 自动获取 Antigravity 版本

on:
  schedule:
    - cron: '0 * * * *' # 每 1 小时运行一次
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    name: 检查与同步
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install requests

      - name: 运行检查脚本
        id: check
        run: python check_version.py

      - name: 提交并推送更改
        if: steps.check.outputs.readme_changed == 'true' || steps.check.outputs.version_changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add VERSION README.md history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新版本至 ${{ steps.check.outputs.version }}" && git push)
